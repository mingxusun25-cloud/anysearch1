[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anysearch1"
version = "1.0.0"
description = "纯标准库实现的本地文本搜索命令行工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["search", "grep", "cli", "text-search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
anysearch1 = "anysearch:main"

[tool.setuptools]
py-modules = ["anysearch"]
